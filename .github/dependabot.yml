# Weekly dependency updates as pull requests (#26). They target dev, like every other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      # One PR for all small updates; majors still come one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to match the Playwright CI container image (mcr.microsoft.com/playwright); upgrade both together.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"
      # Majors need hands-on work (TypeScript 7, @types/node newer than the Node 22 we run); bump these on purpose, not via Dependabot.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Chicago

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    name: Lint, types, unit & worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Generated Worker types are up to date
        run: npm run types -- --check
      - run: npm run test:coverage
      - name: Build and bundle the Worker
        run: npx wrangler deploy --dry-run --outdir dist

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Browsers and system libraries come preinstalled in Playwright's image (matches @playwright/test)
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
